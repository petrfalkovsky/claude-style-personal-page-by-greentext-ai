<head>

  <link rel="stylesheet" href="css/base.css?v=3">

  <link rel="stylesheet" href="css/input.css?v=3">
  <link rel="stylesheet" href="css/responsive.css?v=3">
</head>
<body>
  <div class="stage">
    <main class="terminal" id="terminal" aria-label="Interactive terminal portfolio of Peter Parker">
      <header class="titlebar">
        <div class="lights" aria-hidden="true">
          <span class="light light-r"></span>
          <span class="light light-y"></span>
          <span class="light light-g"></span>
        </div>
        <div class="titlebar-name">peter@founder: ~/Users/peter</div>
        <nav class="titlebar-links" aria-label="Project sites">
          <a href="https://greentext.ai/" target="_blank" rel="noopener noreferrer">greentext.ai ↗</a>
          <a href="https://github.com/petrfalkovsky" target="_blank" rel="noopener noreferrer">github ↗</a>
          <a id="hire-btn" class="hire-btn" href="https://greentext.ai/api/payments/hire/" target="_blank" rel="noopener noreferrer">hire ↗</a>
        </nav>
        <div class="langbar" id="langbar" role="group" aria-label="Language"></div>
      </header>

      <section class="screen" id="screen" tabindex="0" aria-live="polite" aria-label="Conversation output"></section>

      <div class="chips" id="chips" role="toolbar" aria-label="Quick commands"></div>

      <form class="composer" id="composer" autocomplete="off">
        <span class="composer-prompt" aria-hidden="true">❯</span>
        <input class="composer-input" id="input" type="text" name="command" aria-label="Type a command, for example: whoami, greentext, projects, cv, contact" placeholder="type a command (try: greentext or cv) and press enter" spellcheck="false" autocapitalize="off">
        <span class="composer-hint" aria-hidden="true">enter ↵</span>
      </form>
    </main>
  </div>

  <script src="js/i18n.js?v=3"></script>
  <script src="js/locales/en.js?v=3"></script>
  <script src="js/locales/ru.js?v=3"></script>
  <script src="js/locales/es.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/content.js?v=3"></script>
  <script src="js/engine.js?v=3"></script>
</body>
