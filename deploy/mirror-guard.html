<!-- mirror-guard: вставляется в <head> index.html при выкате (deploy/deploy-mirrors.sh).
     Если сайт не догрузился за 4,5 с или упал файл, показывает экран в стиле
     терминала, спрашивает оба зеркала и переводит на то, что ответило
     быстрее. Встроен в страницу, а не файлом: при блокировке файл тоже
     может не дойти. Проверить вручную: ?simulate=blocked -->
<style id="mg-style">
#mg{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;
  background:#16150f;color:#ece9e0;font:14px/1.6 ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;padding:16px}
#mg.on{display:flex}
#mg .box{width:100%;max-width:640px;background:#201f1c;border:1px solid rgba(236,233,224,.10);border-radius:14px;overflow:hidden}
#mg .bar{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(236,233,224,.06);color:#75716a;font-size:12px}
#mg .dot{width:10px;height:10px;border-radius:50%;background:#3a3833}
#mg .body{padding:18px 20px 22px}
#mg h1{font-size:15px;font-weight:600;margin:0 0 10px;color:#d97757}
#mg p{margin:0 0 14px;color:#a8a299}
#mg .log{margin:0;padding:0;list-style:none;color:#ece9e0;font-size:13px}
#mg .log li::before{content:"❯ ";color:#d97757}
#mg .log .dim{color:#75716a}
#mg .cur{display:inline-block;width:8px;height:15px;background:#d97757;vertical-align:-2px;animation:mgb 1s steps(1) infinite}
@keyframes mgb{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#mg .cur{animation:none}}
</style>
<script>
(function () {
  var MIRRORS = [
    { name: 'ru.peter.greentext.ai', url: 'https://ru.peter.greentext.ai' },
    { name: 'nl.peter.greentext.ai', url: 'https://nl.peter.greentext.ai' }
  ];
  var WAIT_MS = 4500, PROBE_MS = 6000;
  var q = new URLSearchParams(location.search);
  var simulate = q.get('simulate') === 'blocked';
  var hops = +(sessionStorage.getItem('mg-hops') || 0);
  var loaded = false, shown = false;

  function el(id) { return document.getElementById(id); }
  function line(text, dim) {
    var li = document.createElement('li');
    if (dim) li.className = 'dim';
    li.textContent = text;
    el('mg-log').appendChild(li);
  }
  function build() {
    var d = document.createElement('div');
    d.id = 'mg';
    d.setAttribute('role', 'status');
    d.innerHTML = '<div class="box"><div class="bar"><span class="dot"></span><span class="dot"></span>' +
      '<span class="dot"></span><span style="margin-left:8px">peter@founder: ~/mirror</span></div><div class="body">' +
      '<h1>Looks like access to this site is restricted in your country</h1>' +
      '<p>This may be caused by sanctions or network blocks. We are trying to show you a copy of the site ' +
      'from a local server. Please wait a few seconds while we find the server closest to your region.</p>' +
      '<ul class="log" id="mg-log"></ul><span class="cur"></span></div></div>';
    document.body.appendChild(d);
    return d;
  }
  function probe(m) {
    // Ответ зеркала с CORS: время до ответа и есть «близость» для этого человека.
    var t0 = performance.now(), ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, PROBE_MS);
    return fetch(m.url + '/mirror-ping.json?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal })
      .then(function (r) { if (!r.ok) throw 0; return { m: m, ms: Math.round(performance.now() - t0) }; })
      .catch(function () { return { m: m, ms: -1 }; })
      .finally(function () { clearTimeout(timer); });
  }
  function rescue(reason) {
    if (shown || (loaded && !simulate)) return;
    shown = true;
    (document.body ? Promise.resolve() : new Promise(function (r) { document.addEventListener('DOMContentLoaded', r); }))
      .then(function () {
        build().className = 'on';
        line(reason, true);
        var here = location.hostname;
        var cands = MIRRORS.filter(function (m) { return simulate || m.name !== here; });
        cands.forEach(function (m) { line('probing ' + m.name + ' …'); });
        return Promise.all(cands.map(probe));
      })
      .then(function (res) {
        res.forEach(function (r) { line(r.m.name + (r.ms < 0 ? ' — no answer' : ' — ' + r.ms + ' ms'), r.ms < 0); });
        var ok = res.filter(function (r) { return r.ms >= 0; }).sort(function (a, b) { return a.ms - b.ms; });
        if (!ok.length || hops >= 2) {
          line(ok.length ? 'still unstable here — reload to try again' : 'no server answered yet — retrying in 5 s');
          setTimeout(function () { location.reload(); }, 5000);
          return;
        }
        var best = ok[0].m;
        line('opening the copy from ' + best.name);
        if (simulate) { line('simulation: staying on this page', true); return; }
        sessionStorage.setItem('mg-hops', String(hops + 1));
        q.delete('simulate');
        var rest = q.toString();
        setTimeout(function () {
          location.replace(best.url + location.pathname + (rest ? '?' + rest : '') + location.hash);
        }, 900);
      });
  }
  window.addEventListener('load', function () { loaded = true; sessionStorage.removeItem('mg-hops'); });
  // Упавший файл сайта — повод не ждать 4,5 секунды.
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) rescue('a part of the site failed to load');
  }, true);
  if (simulate) setTimeout(function () { rescue('simulation: site is unreachable'); }, 300);
  else setTimeout(function () { if (!loaded) rescue('the site is loading too slowly'); }, WAIT_MS);
})();
</script>
