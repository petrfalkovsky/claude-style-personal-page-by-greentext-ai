# your-domain.example.com — статическое терминал-портфолио
# Файлы: /var/www/personal-site (rsync из founder_cv/site/, см. deploy.sh)
#
# ВАЖНО про SSL: текущий origin-сертификат (/etc/ssl/your-domain/fullchain.pem)
# выписан только на greentext.ai / www / app — peter в SAN НЕТ.
# - Если в Cloudflare режим SSL "Full" (не strict) — это не проблема, конфиг ниже работает как есть.
# - Если "Full (strict)" — нужно перевыпустить Cloudflare Origin Certificate
#   с *.greentext.ai (Dashboard → SSL/TLS → Origin Server → Create) и заменить пару файлов.

server {
    listen 80;
    server_name your-domain.example.com;
    return 301 https://your-domain.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.example.com;

    ssl_certificate     /etc/ssl/your-domain/fullchain.pem;
    ssl_certificate_key /etc/ssl/your-domain/privkey.pem;

    root /var/www/personal-site;
    index index.html;

    # статика с длинным кэшем (контент версионируется деплоем)
    location ~* \.(css|js|jpg|jpeg|png|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # PDF-резюме — отдавать как скачивание не нужно, браузер сам решит
    location /cv/ {
        expires 1d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
